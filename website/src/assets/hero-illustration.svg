    <rect x="636" y="102" width="138" height="72" rx="16"/>
    <rect x="206" y="448" width="138" height="72" rx="16"/>
    <rect x="636" y="448" width="138" height="72" rx="16"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial" font-size="14" font-weight="700" fill="#d7e8f8">
