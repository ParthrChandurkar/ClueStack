# CI/CD pipeline for validating, building, publishing, and deploying ClueStack.
name: ClueStack CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint backend
        working-directory: backend
        run: ruff check app tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Install CLI package
        run: pip install -e .

      - name: Lint CLI package
        run: ruff check infrawatch tests

      - name: Run CLI tests
        run: python -m pytest tests

      - name: Verify CLI entry point
        run: |
          infrawatch --help
          infrawatch --version

      - name: Build Python package
        run: |
          python -m pip install build
          python -m build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend image locally
        run: docker build -t infrawatch-backend:test ./backend

      - name: Build frontend image locally
        run: docker build -t infrawatch-frontend:test ./frontend

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform foundation
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate

  publish:
    name: Publish immutable images
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require DockerHub credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DockerHub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Normalize DockerHub username
        run: |
          clean_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$clean_username" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty after trimming whitespace."
            exit 1
          fi
          echo "DOCKERHUB_USERNAME_CLEAN=$clean_username" >> "$GITHUB_ENV"

      - name: Set Docker image names
        run: |
          echo "BACKEND_IMAGE=${DOCKERHUB_USERNAME_CLEAN}/infrawatch-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${DOCKERHUB_USERNAME_CLEAN}/infrawatch-frontend" >> "$GITHUB_ENV"

      - name: Log in to DockerHub
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME_CLEAN" --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:${GITHUB_SHA}" \
            -t "$BACKEND_IMAGE:latest" \
            ./backend
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker push "$BACKEND_IMAGE:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t "$FRONTEND_IMAGE:${GITHUB_SHA}" \
            -t "$FRONTEND_IMAGE:latest" \
            ./frontend
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"
          docker push "$FRONTEND_IMAGE:latest"

  deploy:
    name: Deploy to configured Kubernetes cluster
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Kubernetes deployment credentials
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::notice::KUBE_CONFIG_B64 is not configured. Docker images were published, but Kubernetes deployment is skipped."
            echo "KUBE_DEPLOY_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "KUBE_DEPLOY_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Mark deployment skipped
        if: env.KUBE_DEPLOY_ENABLED == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "ClueStack Kubernetes deployment",
              description: "Skipped: KUBE_CONFIG_B64 is not configured."
            });

      - name: Mark deployment pending
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "ClueStack Kubernetes deployment",
              description: "Published images are being rolled out to Kubernetes."
            });

      - name: Set Docker image names
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          clean_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$clean_username" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty after trimming whitespace."
            exit 1
          fi
          echo "BACKEND_IMAGE=${clean_username}/infrawatch-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${clean_username}/infrawatch-frontend" >> "$GITHUB_ENV"

      - name: Configure kubectl
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set up Terraform
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Apply Terraform foundation
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          terraform -chdir=terraform init
          import_if_exists() {
            address="$1"
            import_id="$2"
            shift 2
            if kubectl "$@" >/dev/null 2>&1; then
              terraform -chdir=terraform import "$address" "$import_id" || true
            fi
          }
          import_if_exists kubernetes_namespace_v1.infrawatch infrawatch get namespace infrawatch
          import_if_exists kubernetes_service_account_v1.backend infrawatch/infrawatch-backend get serviceaccount infrawatch-backend --namespace infrawatch
          import_if_exists kubernetes_cluster_role_v1.local_reader infrawatch-local-reader get clusterrole infrawatch-local-reader
          import_if_exists kubernetes_cluster_role_binding_v1.local_reader infrawatch-local-reader get clusterrolebinding infrawatch-local-reader
          import_if_exists kubernetes_role_v1.deployer infrawatch/infrawatch-deployer get role infrawatch-deployer --namespace infrawatch
          import_if_exists kubernetes_role_binding_v1.deployer infrawatch/infrawatch-deployer get rolebinding infrawatch-deployer --namespace infrawatch
          import_if_exists kubernetes_resource_quota_v1.infrawatch infrawatch/infrawatch-quota get resourcequota infrawatch-quota --namespace infrawatch
          import_if_exists kubernetes_config_map_v1.backend_config infrawatch/infrawatch-backend-config get configmap infrawatch-backend-config --namespace infrawatch
          terraform -chdir=terraform apply -auto-approve

      - name: Apply Kubernetes manifests
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: kubectl apply -k k8s

      - name: Roll out new images
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          kubectl set image deployment/infrawatch-backend backend="$BACKEND_IMAGE:${GITHUB_SHA}" --namespace infrawatch
          kubectl set image deployment/infrawatch-frontend frontend="$FRONTEND_IMAGE:${GITHUB_SHA}" --namespace infrawatch
          kubectl rollout status deployment/infrawatch-backend --namespace infrawatch --timeout=180s
          kubectl rollout status deployment/infrawatch-frontend --namespace infrawatch --timeout=180s

      - name: Mark deployment result
        if: always() && env.KUBE_DEPLOY_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "ClueStack Kubernetes deployment",
              description: state === "success"
                ? "ClueStack Kubernetes rollout completed."
                : "ClueStack Kubernetes rollout failed."
            });

  deploy-local-minikube:
    name: Deploy to local Minikube through self-hosted runner
    needs: publish
    runs-on: [self-hosted, Windows, X64, local-k8s]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.INFRAWATCH_DEPLOY_TARGET == 'local-minikube' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalize DockerHub image names
        shell: powershell
        run: |
          $cleanUsername = ($env:DOCKERHUB_USERNAME -replace '\s', '').ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($cleanUsername)) {
            throw "DOCKERHUB_USERNAME is empty after trimming whitespace."
          }
          "DOCKERHUB_USERNAME_CLEAN=$cleanUsername" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BACKEND_IMAGE=$cleanUsername/infrawatch-backend" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FRONTEND_IMAGE=$cleanUsername/infrawatch-frontend" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Minikube context
        shell: powershell
        run: |
          # Pin both tools to this file; never change the runner's current context.
          try {
            $context = kubectl --context=minikube --kubeconfig "$HOME/.kube/config" config view --minify -o 'jsonpath={.contexts[0].name}' 2>$null
            if ($LASTEXITCODE -ne 0 -or $context -cne 'minikube') {
              throw "Context verification failed."
            }
            kubectl --context=minikube --kubeconfig "$HOME/.kube/config" --request-timeout=10s get nodes -o name > $null 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "Cluster access verification failed."
            }
          } catch {
            throw "Cannot verify the minikube context in the runner's default kubeconfig. No deployment was attempted."
          }

      - name: Require existing deployment secrets
        shell: powershell
        run: |
          # Print only fixed validation markers, never Secret data. Provision/rotate
          # credentials outside CI; changing a Secret does not rotate a database role.
          try {
            $databaseSecret = kubectl --context=minikube --kubeconfig "$HOME/.kube/config" --request-timeout=10s get secret infrawatch-secrets --namespace infrawatch -o 'go-template={{.type}}:{{if and .data.POSTGRES_PASSWORD .data.DATABASE_URL}}ready{{end}}' 2>$null
            if ($LASTEXITCODE -ne 0 -or $databaseSecret -cne 'Opaque:ready') {
              throw "Database credential check failed."
            }
            $registrySecret = kubectl --context=minikube --kubeconfig "$HOME/.kube/config" --request-timeout=10s get secret dockerhub-pull-secret --namespace infrawatch -o 'go-template={{.type}}:{{if .data}}ready{{end}}' 2>$null
            if ($LASTEXITCODE -ne 0 -or $registrySecret -cne 'kubernetes.io/dockerconfigjson:ready') {
              throw "Registry credential check failed."
            }
          } catch {
            throw "Required deployment Secrets are missing, incomplete, or unreadable. See README CI/CD notes. No deployment was attempted."
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # State inspection is captured in memory, never exported as step output.
          terraform_wrapper: false

      - name: Apply Terraform local foundation
        shell: powershell
        run: |
          terraform -chdir=terraform init
          if ($LASTEXITCODE -ne 0) { throw "Terraform initialization failed." }
          try {
            # Reads the selected workspace/backend; no refresh or state mutation.
            $stateJson = terraform -chdir=terraform show -json 2>$null
            if ($LASTEXITCODE -ne 0) { throw "State inspection failed." }
            $state = ($stateJson -join "`n") | ConvertFrom-Json -ErrorAction Stop
            if ($state -isnot [System.Management.Automation.PSCustomObject] -or $state.format_version -cne '1.0') {
              throw "Unsupported state output."
            }
            $managedResources = [System.Collections.Generic.Dictionary[string,string]]::new([StringComparer]::Ordinal)
            # An empty/new state has format_version but no values. Current
            # foundation addresses are all root-module resources.
            if ($null -ne $state.values) {
              if ($state.values.root_module -isnot [System.Management.Automation.PSCustomObject]) {
                throw "Invalid state output."
              }
              foreach ($resource in $state.values.root_module.resources) {
                if ($resource.mode -ceq 'managed') {
                  if ([string]::IsNullOrWhiteSpace($resource.address) -or [string]::IsNullOrWhiteSpace($resource.values.id)) {
                    throw "Invalid managed resource."
                  }
                  $managedResources[$resource.address] = $resource.values.id
                }
              }
            }
          } catch {
            throw "Cannot inspect Terraform state safely. Apply was not attempted."
          } finally {
            $stateJson = $null
            $state = $null
          }
          function Import-IfExists {
            param(
              [string]$Address,
              [string]$ImportId,
              [string[]]$KubectlArguments
            )
            if ($managedResources.ContainsKey($Address)) {
              if ($managedResources[$Address] -cne $ImportId) {
                throw "Terraform state identity mismatch for $Address. Apply was not attempted."
              }
              return
            }
            try {
              # The client classifies API NotFound; never parse human-readable errors.
              $resourceName = kubectl --context=minikube --kubeconfig "$HOME/.kube/config" --request-timeout=10s @KubectlArguments --ignore-not-found -o name 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Resource lookup failed." }
            } catch {
              throw "Kubernetes lookup failed for $Address. Apply was not attempted."
            }
            if ([string]::IsNullOrWhiteSpace(($resourceName -join "`n"))) { return }
            try {
              terraform -chdir=terraform import "-var=kube_context=minikube" "-var=kubeconfig_path=$HOME/.kube/config" $Address $ImportId > $null 2>&1
              if ($LASTEXITCODE -ne 0) { throw "Import failed." }
            } catch {
              throw "Terraform import failed for $Address. Apply was not attempted."
            }
            $managedResources[$Address] = $ImportId
          }
          Import-IfExists "kubernetes_namespace_v1.infrawatch" "infrawatch" @("get", "namespace", "infrawatch")
          Import-IfExists "kubernetes_service_account_v1.backend" "infrawatch/infrawatch-backend" @("get", "serviceaccount", "infrawatch-backend", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_cluster_role_v1.local_reader" "infrawatch-local-reader" @("get", "clusterrole", "infrawatch-local-reader")
          Import-IfExists "kubernetes_cluster_role_binding_v1.local_reader" "infrawatch-local-reader" @("get", "clusterrolebinding", "infrawatch-local-reader")
          Import-IfExists "kubernetes_role_v1.deployer" "infrawatch/infrawatch-deployer" @("get", "role", "infrawatch-deployer", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_role_binding_v1.deployer" "infrawatch/infrawatch-deployer" @("get", "rolebinding", "infrawatch-deployer", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_resource_quota_v1.infrawatch" "infrawatch/infrawatch-quota" @("get", "resourcequota", "infrawatch-quota", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_config_map_v1.backend_config" "infrawatch/infrawatch-backend-config" @("get", "configmap", "infrawatch-backend-config", "--namespace", "infrawatch")
          terraform -chdir=terraform apply -auto-approve "-var=kube_context=minikube" "-var=kubeconfig_path=$HOME/.kube/config"
          if ($LASTEXITCODE -ne 0) { throw "Terraform foundation apply failed." }

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" apply -k k8s
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes manifest apply failed." }

      - name: Configure DockerHub pull secret on workloads
        shell: powershell
        run: |
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" patch serviceaccount default --namespace infrawatch --type merge --patch '{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}'
          if ($LASTEXITCODE -ne 0) { throw "Default ServiceAccount configuration failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" patch serviceaccount infrawatch-backend --namespace infrawatch --type merge --patch '{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}'
          if ($LASTEXITCODE -ne 0) { throw "Backend ServiceAccount configuration failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" patch deployment infrawatch-backend --namespace infrawatch --type merge --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}}}}'
          if ($LASTEXITCODE -ne 0) { throw "Backend pull-secret configuration failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" patch deployment infrawatch-frontend --namespace infrawatch --type merge --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}}}}'
          if ($LASTEXITCODE -ne 0) { throw "Frontend pull-secret configuration failed." }

      - name: Roll out published DockerHub images
        shell: powershell
        run: |
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" set image deployment/infrawatch-backend backend="$env:BACKEND_IMAGE:$env:GITHUB_SHA" --namespace infrawatch
          if ($LASTEXITCODE -ne 0) { throw "Backend image update failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" set image deployment/infrawatch-frontend frontend="$env:FRONTEND_IMAGE:$env:GITHUB_SHA" --namespace infrawatch
          if ($LASTEXITCODE -ne 0) { throw "Frontend image update failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" rollout status statefulset/infrawatch-postgres --namespace infrawatch --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL rollout check failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" rollout status deployment/infrawatch-backend --namespace infrawatch --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Backend rollout check failed." }
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" rollout status deployment/infrawatch-frontend --namespace infrawatch --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Frontend rollout check failed." }

      - name: Show local service URLs
        shell: powershell
        run: |
          kubectl --context=minikube --kubeconfig "$HOME/.kube/config" get pods,svc --namespace infrawatch
          if ($LASTEXITCODE -ne 0) { throw "Workload listing failed." }
          minikube --profile=minikube service infrawatch-frontend --namespace infrawatch --url
